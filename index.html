<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FF5A1F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nomz"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22%23FF5A1F%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2252%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Arial%22 font-weight=%22bold%22%3En%3C/text%3E%3C/svg%3E"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Nomz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone app shell. Sticky header, sunset-gradient hero, white cards, floating + button in a 5-slot bottom bar, slide-up sheets for every add/save flow */
:root{
  --bg:#F5F6FB; --surface:#FFFFFF; --surface-2:#EEF0F7; --ink:#171A2C; --muted:#646A85; --line:#E3E6F0;
  --brand:#FF5A1F; --brand-2:#F72585; --brand-ink:#FFFFFF;
  --good:#12B76A; --mid:#F5A300; --bad:#F04438;
  --protein:#3D7BFF; --carbs:#FFB020; --fat:#FF4D8D; --water:#06B6D4; --fast:#7C5CFF;
  --shadow:0 6px 20px rgba(23,26,44,.07);
  --display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F1A; --surface:#171A2B; --surface-2:#22263A; --ink:#F1F2F8; --muted:#9CA1BC; --line:#2B3049;
  --brand:#FF7A45; --brand-2:#FF4FA3; --brand-ink:#FFFFFF; --good:#32D583; --mid:#FDB022; --bad:#F97066;
  --protein:#6E9BFF; --carbs:#FFC24D; --fat:#FF7AAE; --water:#22D3EE; --fast:#9B85FF; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F1A; --surface:#171A2B; --surface-2:#22263A; --ink:#F1F2F8; --muted:#9CA1BC; --line:#2B3049;
  --brand:#FF7A45; --brand-2:#FF4FA3; --brand-ink:#FFFFFF; --good:#32D583; --mid:#FDB022; --bad:#F97066;
  --protein:#6E9BFF; --carbs:#FFC24D; --fat:#FF7AAE; --water:#22D3EE; --fast:#9B85FF; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
html,body{overflow-x:clip}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
main.wrap>*{min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background .2s,opacity .2s}
button:active{transform:scale(.95)}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}

header.top{position:sticky;top:0;z-index:15;background:var(--bg);flex-direction:row;align-items:center;justify-content:space-between;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;margin-top:calc(-1 * env(safe-area-inset-top,0px));
  box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax)}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--brand) 0 30%,var(--carbs) 0 55%,var(--good) 0 75%,var(--brand-2) 0);display:inline-block;
  box-shadow:inset 0 0 0 5px var(--bg)}
.hright{display:flex;align-items:center;gap:6px}
.sync{font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--surface-2)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.saved::before{background:var(--good)} .sync.saving::before{background:var(--mid);animation:pulse 1s infinite} .sync.error::before{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:17px;font-weight:700}

.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar h1{font-size:26px;font-weight:800}
.daynav{display:flex;gap:6px}
.streak{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#FFE3D3,#FFD0E6);color:#8A2A00;font-weight:800;font-size:13px;padding:6px 11px;border-radius:999px}
:root[data-theme="dark"] .streak{background:linear-gradient(135deg,#4A2414,#4A1733);color:#FFC7A8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .streak{background:linear-gradient(135deg,#4A2414,#4A1733);color:#FFC7A8}}

.banner{background:var(--surface);border:1.5px dashed var(--brand);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--brand);color:var(--brand-ink);font-weight:800;white-space:nowrap;border-radius:999px;padding:7px 12px;font-size:13px}

.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;border-radius:24px;padding:18px;position:relative;overflow:hidden;box-shadow:0 12px 30px rgba(247,37,133,.28)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero-in{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;position:relative;z-index:1}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .arc{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.ring .sub{font-size:12px;opacity:.9;font-weight:600}
.hstats{display:flex;flex-direction:column;gap:9px}
.hs{display:flex;align-items:center;gap:10px}
.hs .ic{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:15px}
.hs small{display:block;font-size:11px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hs b{font-size:16px;font-weight:800}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.macro{background:rgba(255,255,255,.16);border-radius:14px;padding:10px}
.macro .t{font-size:12px;font-weight:700;opacity:.95}
.macro .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden;margin:6px 0 5px}
.macro .bar i{display:block;height:100%;border-radius:3px;background:#fff;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.macro .v{font-size:13px;font-weight:800}
.macro .v small{opacity:.8;font-weight:600}

.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row2>.card{min-width:0;padding:14px}
.tile h3{font-size:16px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile h3 .pill{white-space:nowrap;font-family:var(--body);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.pill.water{background:color-mix(in srgb,var(--water) 16%,transparent);color:var(--water)}
.pill.steps{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.glasses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 10px}
.glass{aspect-ratio:3/4;max-width:100%;border-radius:5px 5px 10px 10px;border:2px solid var(--water);background:transparent;padding:0;position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#67E8F9,var(--water));transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.glass.on::after{height:80%}
.stepper{display:flex;gap:6px}
.stepper button{flex:1;white-space:nowrap;font-size:14px;border:0;border-radius:12px;padding:9px 0;font-weight:800;background:var(--surface-2)}
.stepper button.pri{background:var(--water);color:#fff}
.bigval{font-family:var(--display);font-size:28px;font-weight:800;margin-top:8px}
.bar2{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:6px 0 10px}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#4ADE80,var(--good));border-radius:4px;transition:width .9s}
.inrow{display:flex;gap:6px}
.inrow input{flex:1;min-width:0;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px}
.btn-s{border:0;border-radius:12px;padding:8px 12px;font-weight:800;background:var(--good);color:#fff;white-space:nowrap}

.badges{max-width:100%;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -2px}
.badge{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:8px 12px 8px 8px;box-shadow:var(--shadow);font-size:13px;font-weight:700}
.badge .bi{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--surface-2);filter:grayscale(1);opacity:.5}
.badge.on .bi{filter:none;opacity:1;background:linear-gradient(135deg,#FFE08A,#FFB020)}
.badge small{display:block;color:var(--muted);font-weight:600;font-size:11px}

.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meal-h .mt{display:flex;align-items:center;gap:10px}
.meal-h .em{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.meal-h h3{font-size:17px;font-weight:800}
.meal-h small{color:var(--muted);font-size:12px;font-weight:600}
.addbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 40%,transparent)}
.items{margin-top:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--good) 25%,transparent)}100%{background:transparent}}
.item .n{min-width:0;display:flex;gap:10px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.g{background:var(--good)} .dot.y{background:var(--mid)} .dot.r{background:var(--bad)}
.item .n div{font-weight:700;font-size:14px}
.item .n small{color:var(--muted);font-size:12px}
.item .r{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap}
.x{border:0;background:var(--surface-2);width:28px;height:28px;border-radius:50%;font-size:12px;color:var(--muted)}
.copy{margin-top:8px;border:0;background:none;color:var(--brand);font-weight:800;font-size:13px;padding:4px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);box-shadow:0 -4px 20px rgba(23,26,44,.08);
  padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:520px;align-items:end}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;font-weight:700;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-selected="true"]{color:var(--brand)}
nav.tabs .fab{width:58px;height:58px;border-radius:50%;margin:-26px auto 0;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;
  box-shadow:0 8px 20px rgba(247,37,133,.4);display:grid;place-items:center;padding:0}
nav.tabs .fab svg{width:28px;height:28px}

.chart svg{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--body);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{border:0;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:var(--brand-ink);border-radius:16px;padding:14px 16px;font-weight:800;font-size:16px;width:100%;box-shadow:0 6px 16px rgba(247,37,133,.25)}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.green{background:var(--good);box-shadow:0 6px 16px color-mix(in srgb,var(--good) 35%,transparent)}
.bignum{font-family:var(--display);font-weight:800;font-size:34px}
.goalbox div{background:var(--surface-2);border-radius:14px;padding:10px 4px;text-align:center}
.goalbox b{display:block;font-family:var(--display);font-size:20px}
.goalbox span{font-size:11px;color:var(--muted);font-weight:600}

.fastring{display:grid;place-items:center;margin:6px 0 4px}
.fastring .ring{width:230px;height:230px}
.fastring .big{font-size:40px}
.plans{display:flex;gap:8px;overflow-x:auto}
.plan{flex:1 0 auto;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-weight:800;text-align:center}
.plan small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.plan[aria-pressed="true"]{border-color:var(--fast);background:color-mix(in srgb,var(--fast) 12%,var(--surface));color:var(--fast)}
.stages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stage{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:8px 2px;border-radius:12px;background:var(--surface-2)}
.stage b{display:block;font-size:16px}
.stage.on{background:color-mix(in srgb,var(--fast) 16%,transparent);color:var(--fast)}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;white-space:pre-wrap;line-height:1.5}
.msg.me{align-self:flex-end;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.coachhead{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:conic-gradient(from 200deg,var(--brand),var(--brand-2),var(--fast),var(--brand));display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--display);font-size:20px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:12px 16px;box-shadow:var(--shadow)}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--brand),var(--brand-2));color:#fff;font-size:18px;font-weight:800}

.scrim{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:24px 24px 0 0;max-height:92%;display:flex;flex-direction:column;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.sheet .in{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1;overflow-y:auto}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:21px;font-weight:800}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 4px;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa .qi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;color:#fff}
.search{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;width:100%}
.food{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 12px;background:var(--surface);border-radius:14px;border:0;width:100%;text-align:left}
.foods{display:flex;flex-direction:column;gap:6px}
.food .n{min-width:0;display:flex;gap:10px;align-items:center}
.food .n div{font-weight:700;font-size:14px}
.food .n small{color:var(--muted);font-size:12px}
.food .k{font-weight:800;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.food .plus{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;font-size:18px}
.detail-top{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grade{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;align-self:flex-start}
.grade.g{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.grade.y{background:color-mix(in srgb,var(--mid) 18%,transparent);color:var(--mid)}
.grade.r{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.qtyrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qbig{display:flex;align-items:center;gap:12px}
.qbig button{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);font-size:22px;font-weight:800}
.qbig span{font-family:var(--display);font-size:28px;font-weight:800;min-width:48px;text-align:center}
.mbars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mb{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.mb b{display:block;font-size:18px;font-weight:800}
.mb span{font-size:11px;font-weight:700}
.photo{width:100%;border-radius:16px;max-height:220px;object-fit:cover;display:block}
.drop{border:2px dashed var(--brand);border-radius:18px;padding:22px 12px;text-align:center;background:var(--surface);font-weight:700;display:block;cursor:pointer}
.drop input{display:none}
.ai-item{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 12px}
.ai-item input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.ai-item .n{flex:1;min-width:0}
.ai-item .n div{font-weight:700;font-size:14px}
.ai-item .n small{color:var(--muted);font-size:12px}
.mini-q{display:flex;align-items:center;gap:4px}
.mini-q button{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface-2);font-weight:800}
.mini-q span{min-width:26px;text-align:center;font-weight:800;font-size:13px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 10px 10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:30;display:flex;gap:12px;align-items:center;animation:tin .3s cubic-bezier(.2,.9,.3,1.3);max-width:calc(100% - 32px)}
.toast button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);font-weight:800;border-radius:999px;padding:5px 12px}
.toast.solo{padding-right:16px}
@keyframes tin{from{transform:translate(-50%,20px);opacity:0}}
.quote{position:relative;border-radius:20px;padding:16px 16px 14px 48px;background:linear-gradient(135deg,color-mix(in srgb,var(--fast) 16%,var(--surface)),color-mix(in srgb,var(--brand-2) 14%,var(--surface)));box-shadow:var(--shadow);animation:qin .6s ease-out}
.quote .qm{position:absolute;left:14px;top:4px;font-family:var(--display);font-size:52px;font-weight:800;line-height:1;background:linear-gradient(140deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.quote p{margin:0;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.3;text-wrap:balance}
.quote small{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:700}
@keyframes qin{from{opacity:.3;transform:translateY(6px)}}
.guess{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700;background:var(--surface);border-radius:12px;padding:9px 12px}
.guess .gb{flex:1;height:6px;border-radius:3px;background:var(--surface-2);align-self:center;overflow:hidden;max-width:90px}
.guess .gb i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero-in{grid-template-columns:1fr;justify-items:center}.hstats{width:100%}}

const fmtQ=q=>q===0.5?"½":q===1.5?"1½":q===2.5?"2½":String(q);

function grade(f){const kc=Math.max(f.kcal,1),pr=f.p*4/kc,fr=f.f*9/kc;
  if(pr>=.25||(kc<=130&&fr<.45))return["g","Smart pick"];
  if(fr>.5||kc>=380)return["r","Go easy"];return["y","Moderate"];}

/* ---------- state ---------- */
function blankDay(){return{foods:[],water:0,steps:0}}
function sampleState(){
  const pick=n=>FOODS.find(f=>f.name===n),mk=l=>l.map(([n,q,m])=>({...pick(n),uid:uid(),qty:q,meal:m}));
  const days={};
  days[TODAY]={foods:mk([["Idli",3,"Breakfast"],["Sambar",1,"Breakfast"],["Coconut chutney",1,"Breakfast"],["Masala chai",1,"Breakfast"],["Steamed rice",1,"Lunch"],["Rajma",1,"Lunch"],["Curd (dahi)",1,"Lunch"],["Banana",1,"Snacks"]]),water:5,steps:6240};
  const menus=[[["Poha",1,"Breakfast"],["Masala chai",1,"Breakfast"],["Roti / chapati",3,"Lunch"],["Dal tadka",1,"Lunch"],["Bhindi sabzi",1,"Lunch"],["Roasted chana",1,"Snacks"],["Chicken curry",1,"Dinner"],["Steamed rice",1,"Dinner"]],
    [["Oats with milk",1,"Breakfast"],["Veg biryani",1,"Lunch"],["Raita",1,"Lunch"],["Samosa",1,"Snacks"],["Masala chai",1,"Snacks"],["Palak paneer",1,"Dinner"],["Roti / chapati",2,"Dinner"]],
    [["Masala omelette",1,"Breakfast"],["Roti / chapati",2,"Breakfast"],["Chole",1,"Lunch"],["Jeera rice",1,"Lunch"],["Apple",1,"Snacks"],["Khichdi",1,"Dinner"],["Curd (dahi)",1,"Dinner"]]];
  for(let i=1;i<=6;i++)days[addDays(TODAY,-i)]={foods:mk(menus[i%3]),water:5+(i%4),steps:5000+i*900%6000};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}

/* ---------- saving: this phone right away, then your Claude account ---------- */
let DB=null,UID=null,dirty=new Set(),flushT=null,chain=Promise.resolve();
const dk=d=>"d"+d.replace(/-/g,"");
function setSync(s){const el=$("sync");el.className="sync "+s;el.textContent={saved:"Saved",saving:"Saving…",error:"Retrying…",local:"On this phone"}[s]}
function persist(keys){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  keys.forEach(k=>dirty.add(k));
  if(S.sample&&!persist.all){persist.all=1;Object.keys(S.days).forEach(k=>dirty.add(k))}
  if(!DB){setSync("local");return}
  setSync("saving");clearTimeout(flushT);flushT=setTimeout(flush,600);
}
function metaDoc(){const{days,...m}=S;return JSON.parse(JSON.stringify(m))}
function flush(){
  const keys=[...dirty];dirty.clear();
  chain=chain.then(async()=>{
    const col=DB.collection("data/users/"+UID);
    for(const k of keys){
      if(k==="meta")await col.doc("meta").set(metaDoc());
      else{const d=S.days[k];if(d&&(d.foods.length||d.water||d.steps))await col.doc(dk(k)).set({date:k,...JSON.parse(JSON.stringify(d))});else await col.doc(dk(k)).delete()}
    }
    if(!dirty.size)setSync("saved");
  }).catch(e=>{keys.forEach(k=>dirty.add(k));setSync("error");clearTimeout(flushT);flushT=setTimeout(flush,4000)});
}
const save=(...days)=>persist(["meta",...days]);

/* ---------- ui state ---------- */
let tab="home",cur=TODAY,sheet=null,anim={pct:0,mac:[0,0,0],steps:0},toastUndo=null,flashUid=null;

function targets(){
  const p=S.profile,bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const kcal=Math.max(1200,r0((bmr*p.activity+Number(p.goal))/10)*10);
  return{bmr:r0(bmr),kcal,p:r0(Math.max(p.weight*1.4,kcal*.2/4)),c:r0(kcal*.5/4),f:r0(kcal*.27/9)};

function totals(d){return(S.days[d]?.foods||[]).reduce((a,x)=>{a.kcal+=x.kcal*x.qty;a.p+=x.p*x.qty;a.c+=x.c*x.qty;a.f+=x.f*x.qty;return a},{kcal:0,p:0,c:0,f:0})}
function streak(){let n=0,d=S.days[TODAY]?.foods.length?TODAY:addDays(TODAY,-1);while(S.days[d]?.foods.length){n++;d=addDays(d,-1)}return n}
function dateLabel(d){if(d===TODAY)return"Today";if(d===addDays(TODAY,-1))return"Yesterday";
  return new Date(d+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}
function badgesFor(d){const t=targets(),tot=totals(d),dd=day(d),p=S.profile;
  return[["🔥",`${streak()}-day streak`,"Log every day",streak()>=3],["💧","Hydrated",`${p.waterGoal} glasses`,dd.water>=p.waterGoal],

    ["🎯","On budget","Within calories",tot.kcal>0&&tot.kcal<=t.kcal&&dd.foods.some(f=>f.meal==="Dinner")]]}

function ringSVG(R,stroke,track,pct,color,cls="arc"){const C=2*Math.PI*R,s=R*2+stroke+4,c=s/2;

function viewHome(){

     <div class="bar"><i data-w="${Math.min(v/g*100,100)}" style="width:${anim.mac[i]}%"></i></div><div class="v num">${r0(v)}<small> / ${g}g</small></div></div>`).join("")}</div></section>`;
  h+=`<div class="badges">${badgesFor(cur).map(([e,n,s,on])=>`<div class="badge ${on?"on":""}"><span class="bi">${e}</span><div>${n}<small>${on?"Unlocked":s}</small></div></div>`).join("")}</div>`;
  h+=`<div class="row2"><section class="card tile"><h3>Water <span class="pill water num">${d.water*250} ml</span></h3>
     <div class="glasses">${Array.from({length:p.waterGoal},(_,i)=>`<button class="glass ${i<d.water?"on":""}" data-act="glass" data-i="${i}" aria-label="Glass ${i+1}"></button>`).join("")}</div>

   <section class="card tile"><h3>Steps <span class="pill steps num">${Math.min(100,r0(d.steps/p.stepGoal*100))}%</span></h3>
     <div class="bigval num">${d.steps.toLocaleString("en-IN")}</div><div class="bar2"><i style="width:${Math.min(d.steps/p.stepGoal*100,100)}%"></i></div>

  const y=S.days[addDays(cur,-1)];
  for(const[m,em,bg]of MEALS){
    const items=d.foods.filter(f=>f.meal===m),k=items.reduce((a,x)=>a+x.kcal*x.qty,0),hasY=y?.foods.some(f=>f.meal===m);
    h+=`<section class="card"><div class="meal-h"><div class="mt"><span class="em" style="background:${bg}">${em}</span><div><h3>${m}</h3><small class="num">${items.length?r0(k)+" kcal · "+items.length+" item"+(items.length>1?"s":""):"Nothing yet"}</small></div></div>
      <button class="addbtn" data-act="openAdd" data-meal="${m}" aria-label="Add to ${m}">+</button></div>
      ${items.length?`<div class="items">${items.map(x=>{const g=grade(x);return`<div class="item ${x.uid===flashUid?"flash":""}"><div class="n"><span class="dot ${g[0]}"></span><div><div>${esc(x.name)}</div><small>${fmtQ(x.qty)} × ${esc(x.serving)}</small></div></div>
        <div class="r num">${r0(x.kcal*x.qty)}<button class="x" data-act="del" data-uid="${x.uid}" aria-label="Remove ${esc(x.name)}">✕</button></div></div>`}).join("")}</div>`
      :hasY?`<button class="copy" data-act="copyY" data-meal="${m}">↻ Copy ${m.toLowerCase()} from the day before</button>`:""}</section>`;
  }
  return h;
}

function viewProgress(){
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1),first=ws[0],last=ws.at(-1),t=targets();
  const W=340,H=170,L=34,R=12,T=14,B=24,pts14=ws.slice(-14);let chart=`<div class="note">Log two weigh-ins to see your trend.</div>`;
  if(pts14.length>1){let mn=Math.floor(Math.min(...pts14.map(w=>w.kg))-.5),mx=Math.ceil(Math.max(...pts14.map(w=>w.kg))+.5);
    const x=i=>L+i*(W-L-R)/(pts14.length-1),y=v=>T+(mx-v)*(H-T-B)/(mx-mn),stp=Math.max(1,Math.ceil((mx-mn)/4));let g="";
    for(let v=mn;v<=mx;v+=stp)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
    const P=pts14.map((w,i)=>`${x(i)},${y(w.kg)}`).join(" "),lab=d=>new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
    chart=`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brand-2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brand-2)" stop-opacity="0"/></linearGradient></defs>${g}
     <polygon points="${x(0)},${H-B} ${P} ${x(pts14.length-1)},${H-B}" fill="url(#wg)"/><polyline points="${P}" fill="none" stroke="var(--brand-2)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
     <circle cx="${x(pts14.length-1)}" cy="${y(last.kg)}" r="6" fill="var(--brand-2)" stroke="var(--surface)" stroke-width="3"/>
     <text x="${L}" y="${H-6}">${lab(pts14[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${lab(last.d)}</text></svg></div>`}
  const week=[];for(let i=6;i>=0;i--){const d=addDays(TODAY,-i);week.push({d,k:totals(d).kcal})}
  const mxk=Math.max(t.kcal*1.25,...week.map(w=>w.k)),BW=340,BH=160,bb=22,bt=10,bw=(BW-16)/7,yk=v=>bt+(1-v/mxk)*(BH-bt-bb);
  const bars=week.map((w,i)=>{const X=8+i*bw+bw*.18,Y=yk(w.k),c=!w.k?"var(--surface-2)":w.k>t.kcal*1.05?"var(--bad)":w.k<t.kcal*.7?"var(--mid)":"var(--good)";
    return`<rect x="${X}" y="${w.k?Y:BH-bb-4}" width="${bw*.64}" height="${w.k?BH-bb-Y:4}" rx="6" fill="${c}"/><text x="${X+bw*.32}" y="${BH-6}" text-anchor="middle">${new Date(w.d+"T12:00:00").toLocaleDateString("en-IN",{weekday:"short"}).slice(0,2)}</text>`}).join("");
  const logged=week.filter(w=>w.k),avg=logged.length?logged.reduce((a,w)=>a+w.k,0)/logged.length:0,diff=first&&last?last.kg-first.kg:0;
  const tt=totals(TODAY),mk=tt.p*4+tt.c*4+tt.f*9||1,seg=[[tt.p*4/mk,"var(--protein)"],[tt.c*4/mk,"var(--carbs)"],[tt.f*9/mk,"var(--fat)"]];
  let off=0;const donut=seg.map(([v,c])=>{const C=2*Math.PI*44,s=`<circle cx="55" cy="55" r="44" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${C*v} ${C}" stroke-dashoffset="${-C*off}"/>`;off+=v;return s}).join("");
  return`<div class="daybar"><div><div class="label">Your journey</div><h1>Progress</h1></div></div>
  <section class="card"><div class="label">Weight</div><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="bignum num">${last?last.kg:"–"}<small style="font-size:16px"> kg</small></span>
    ${ws.length>1?`<span class="grade ${diff<=0?"g":"r"} num">${diff<=0?"▼":"▲"} ${Math.abs(diff).toFixed(1)} kg since ${dateLabel(first.d)}</span>`:""}</div>${chart}
    <div class="inrow" style="margin-top:12px"><input id="wIn" inputmode="decimal" placeholder="Today's weight in kg" aria-label="Today's weight in kg"><button class="btn-s" data-act="saveWeight">Save</button></div></section>
  <section class="card"><div class="label">Calories, last 7 days</div><div style="display:flex;align-items:baseline;gap:8px;margin:2px 0 8px"><span class="bignum num" style="font-size:26px">${r0(avg)}</span><span class="muted">avg kcal a day · budget ${t.kcal}</span></div>
    <div class="chart"><svg viewBox="0 0 ${BW} ${BH}"><line x1="8" x2="${BW-8}" y1="${yk(t.kcal)}" y2="${yk(t.kcal)}" stroke="var(--brand)" stroke-width="1.5" stroke-dasharray="5 4"/>${bars}</svg></div>
    <div class="muted" style="font-size:12px;margin-top:6px"><span style="color:var(--good)">●</span> on budget &nbsp;<span style="color:var(--bad)">●</span> over &nbsp;<span style="color:var(--mid)">●</span> under 70%</div></section>
  <section class="card"><div class="label">Today's macro split</div><div style="display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap">
    <svg viewBox="0 0 110 110" style="width:110px;height:110px;transform:rotate(-90deg)"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${tt.kcal?donut:""}</svg>
    <div style="display:flex;flex-direction:column;gap:6px;font-weight:700">${[["Protein",seg[0][0],"--protein",tt.p],["Carbs",seg[1][0],"--carbs",tt.c],["Fat",seg[2][0],"--fat",tt.f]].map(([n,v,c,g])=>`<div><span style="color:var(${c})">●</span> ${n} <span class="muted num">${r0(v*100)}% · ${r0(g)} g</span></div>`).join("")}</div></div></section>
  <section class="card"><div class="label" style="margin-bottom:4px">Weigh-ins</div>${ws.slice().reverse().slice(0,6).map(w=>`<div class="item"><div class="n"><div>${dateLabel(w.d)}</div></div><div class="r num">${w.kg} kg<button class="x" data-act="delW" data-d="${w.d}" aria-label="Remove">✕</button></div></div>`).join("")}</section>`;
}

function fastInfo(){const f=S.fast,now=Date.now();if(!f.start)return null;const el=(now-f.start)/3600e3,goal=f.plan;return{el,goal,pct:Math.min(el/goal,1),done:el>=goal}}
function hms(h){const s=Math.max(0,r0(h*3600));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,"0")).join(":")}
function viewFast(){
  const f=S.fast,fi=fastInfo(),st=[[0,"Fed","🍽️"],[4,"Settling","📉"],[12,"Fat burn","🔥"],[16,"Deep fast","✨"]];
  return`<div class="daybar"><div><div class="label">Intermittent fasting</div><h1>${fi?(fi.done?"Goal reached 🎉":"You're fasting"):"Ready when you are"}</h1></div></div>
  <section class="card"><div class="fastring"><div class="ring">${ringSVG(100,18,"var(--surface-2)",fi?fi.pct:0,"var(--fast)","farc")}
    <div class="mid"><div class="sub muted">${fi?(fi.done?"Fasted for":"Elapsed"):"Plan"}</div><div class="big num" id="fclock">${fi?hms(fi.el):f.plan+":"+(24-f.plan)}</div>
    <div class="sub muted" id="fleft">${fi?(fi.done?"Break your fast when ready":hms(fi.goal-fi.el)+" to go"):"hours fasting : eating"}</div></div></div></div>
    <div class="stages">${st.map(([h,n,e])=>`<div class="stage ${fi&&fi.el>=h?"on":""}"><b>${e}</b>${n}<br><span class="num">${h}h+</span></div>`).join("")}</div></section>
  ${fi?"":`<div class="plans">${PLANS.map(([h,n])=>`<button class="plan" data-act="plan" data-h="${h}" aria-pressed="${f.plan===h}">${h}:${24-h}<small>${n}</small></button>`).join("")}</div>`}
  <button class="btn" style="${fi?"background:var(--fast);box-shadow:none":""}" data-act="${fi?"endFast":"startFast"}">${fi?"End fast":"Start "+f.plan+"-hour fast"}</button>
  ${f.history.length?`<section class="card"><div class="label" style="margin-bottom:4px">Recent fasts</div>${f.history.slice(-5).reverse().map(x=>{const hrs=(x.end-x.start)/3600e3;return`<div class="item"><div class="n"><span class="dot ${hrs>=x.plan?"g":"y"}"></span><div><div>${new Date(x.start).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}</div><small>${x.plan}:${24-x.plan} plan</small></div></div><div class="r num">${r1(hrs)} h</div></div>`}).join("")}</section>`:""}`;
}

function animateHome(){
  const t=targets(),tot=totals(cur),pct=Math.min(tot.kcal/t.kcal,1),arc=document.querySelector(".hero .arc"),bars=document.querySelectorAll(".macro .bar i");
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(arc)arc.setAttribute("stroke-dasharray",`${arc.dataset.c*pct} ${arc.dataset.c}`);bars.forEach((b,i)=>b.style.width=b.dataset.w+"%")}));
  const el=$("kleft"),to=+el.dataset.to,from=anim.kleft??to,t0=performance.now();anim.kleft=to;
  if(from!==to&&!matchMedia("(prefers-reduced-motion:reduce)").matches){(function step(n){const k=Math.min((n-t0)/700,1),e=1-Math.pow(1-k,3);el.textContent=r0(from+(to-from)*e);if(k<1)requestAnimationFrame(step)})(t0)}
  anim.pct=pct;anim.mac=[...bars].map(b=>+b.dataset.w);
}

async function downscale(file){

  const k=Math.min(1,1024/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=r0(img.width*k);c.height=r0(img.height*k);

const LABELMAP=[[/banana/,"Banana"],[/granny smith|apple/,"Apple"],[/mango|orange|lemon|pineapple|fig|pomegranate|jackfruit|custard apple|strawberry/,"Mango","Papaya"],
 [/espresso|coffee|cup|mug|teapot/,"Masala chai","Filter coffee"],[/soup|consomme|hot ?pot|potpie|mixing bowl/,"Dal tadka","Sambar","Khichdi","Rajma"],

async function snapAnalyse(url){
  const s=sheet;
  try{
    s.busy="Loading food scanner (first time takes a few seconds)…";renderSheet();
    if(!window.tf)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js");
    if(!window.mobilenet)await loadScript("https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js");
    if(!MODEL)MODEL=await mobilenet.load({version:2,alpha:1.0});
    if(sheet!==s)return;s.busy="Looking at your food…";renderSheet();
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const preds=await MODEL.classify(img,5);
    const guesses=preds.map(x=>({label:x.className.split(",")[0],full:x.className.toLowerCase(),p:x.probability}));
    const names=[];guesses.forEach(g=>{LABELMAP.forEach(([re,...fs])=>{if(re.test(g.full))fs.forEach(n=>{if(!names.includes(n))names.push(n)})});
      allFoods().forEach(f=>{const w=f.name.toLowerCase().split(/[\s/()]+/).filter(x=>x.length>3);if(w.some(x=>g.full.includes(x))&&!names.includes(f.name))names.push(f.name)})});
    s.guesses=guesses.slice(0,3);s.matches=names.map(n=>allFoods().find(f=>f.name===n)).filter(Boolean).slice(0,6);s.busy=null;
  }catch(e){s.busy=null;s.err="Couldn't run the scanner. Check your internet and try again, or search instead."}
  if(sheet===s)renderSheet();
}

        if(meta){const days={};snap.docs.forEach(d=>{if(d.id!=="meta"){const v=d.data();if(v?.date){const{date,...rest}=v;days[date]=rest}}});S={...meta,days};
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}anim.kleft=undefined;render()}
        setSync("saved");
      }else if(!S.sample){persist(["meta",...Object.keys(S.days)])}else setSync("saved");
      if(dirty.size)flush();
    }catch(e){DB=null;setSync("local")}
  });
}
</script>
